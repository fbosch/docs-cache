name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/opencode-reference-adoption

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify dependency audit
        run: pnpm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-lockfile.yml
          git add pnpm-lock.yaml
          git commit -m "fix(deps): refresh brace-expansion lockfile"
          git push origin HEAD:${{ github.ref_name }}
