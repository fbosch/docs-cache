name: Simplify canonical reference predicate

on:
  push:
    branches:
      - fix/opencode-reference-adoption

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Simplify predicate
        run: |
          python - <<'PY'
          from pathlib import Path

          file_path = Path("src/opencode/references.ts")
          content = file_path.read_text()
          previous = '''const isCanonicalReference = (value: unknown, reference: Reference) =>
          \tisRecord(value) &&
          \tObject.hasOwn(value, "path") &&
          \tObject.hasOwn(value, "description") &&
          \tObject.keys(value).length === 2 &&
          \tvalue.path === reference.path &&
          \tvalue.description === reference.description;
          '''
          replacement = '''const serializeReference = (value: object) =>
          \tJSON.stringify(
          \t\tObject.entries(value).sort(([left], [right]) => left.localeCompare(right)),
          \t);

          const isCanonicalReference = (value: unknown, reference: Reference) =>
          \tisRecord(value) &&
          \tserializeReference(value) === serializeReference(reference);
          '''
          if content.count(previous) != 1:
              raise SystemExit("Expected canonical-reference predicate was not found exactly once")
          file_path.write_text(content.replace(previous, replacement))
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and validate
        run: |
          pnpm exec biome check --write src/opencode/references.ts
          pnpm typecheck

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/simplify-canonical-reference.yml
          git add src/opencode/references.ts
          git commit -m "refactor(opencode): simplify canonical matching"
          git push origin HEAD:${{ github.ref_name }}
